<template>
    <div class="component-root">
        <template if:true={hasCapture}>
            <div class="header">
                <lightning-icon icon-name="standard:case" size="small" class="case-icon"></lightning-icon>
                <div class="header-text">
                    <h3 class="case-number">Case {caseNumber}</h3>
                    <p class="case-subject">{caseSubject} · {accountName}</p>
                </div>
            </div>

            <template if:true={isReady}>
                <div class="panel">
                    <h4 class="panel-title">Used against this case ({usageCount})</h4>
                    <input
                        type="text"
                        class="search-input"
                        placeholder="Search products by name or code…"
                        value={searchTerm}
                        oninput={handleSearchInput}
                    />
                    <template if:true={hasSearchTerm}>
                        <div class="search-results">
                            <template for:each={searchResults} for:item="p">
                                <button
                                    class="search-result"
                                    key={p.productId}
                                    data-id={p.productId}
                                    onclick={handleAddProduct}
                                >
                                    <span class="search-result-name">{p.productName}</span>
                                    <span class="search-result-add">+ Add</span>
                                </button>
                            </template>
                            <template if:false={hasSearchResults}>
                                <div class="empty-hint">No matching priced products.</div>
                            </template>
                        </div>
                    </template>

                    <div class="usage-lines">
                        <template for:each={usageRows} for:item="line">
                            <div class="usage-line" key={line.productId}>
                                <div class="usage-line-text">
                                    <span class="usage-line-name">{line.name}</span>
                                    <span class="usage-line-sub">{line.unitPriceFormatted} each · {line.totalPriceFormatted}</span>
                                </div>
                                <div class="qty-controls">
                                    <button class="qty-btn" data-id={line.productId} onclick={handleQtyDecrement}>−</button>
                                    <span class="qty-value">{line.qty}</span>
                                    <button class="qty-btn" data-id={line.productId} onclick={handleQtyIncrement}>+</button>
                                </div>
                                <button class="remove-btn" data-id={line.productId} onclick={handleRemoveLine}>✕</button>
                            </div>
                        </template>
                        <template if:false={usageCount}>
                            <div class="empty-hint">No products added yet — search above.</div>
                        </template>
                    </div>
                </div>

                <div class="panel">
                    <h4 class="panel-title">Confirmation signature</h4>
                    <canvas class="signature-pad" width="600" height="140"></canvas>
                    <button class="link-button" onclick={handleClearSignature}>Clear signature</button>
                </div>

                <template if:true={error}>
                    <p class="error-text">{error}</p>
                </template>

                <button
                    class="slds-button slds-button_brand generate-button"
                    disabled={submitting}
                    onclick={handleGenerateDraftOrder}
                >{submitting ? 'Generating…' : 'Generate draft order'}</button>
            </template>

            <template if:false={isReady}>
                <div class="confirmation-banner">
                    <p>✓ Draft order generated.</p>
                    <a href={draftOrderUrl} target="_blank" rel="noopener noreferrer" class="order-link">
                        <lightning-icon icon-name="utility:new_window" size="xx-small" class="link-icon"></lightning-icon>
                        <span>Open draft order</span>
                    </a>
                </div>
            </template>
        </template>

        <template if:false={hasCapture}>
            <div class="no-data slds-text-align_center">{summary}</div>
        </template>
    </div>
</template>
